name: C/C++ CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  release:
    types: [published]

jobs:
  # Unit tests, plus the install-layout check: the installed binary is run from
  # an unrelated directory, which is what proves ncp.h is found through
  # ../share/ncpatcher rather than because the build tree was next door.
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNCP_BUILD_TESTS=ON
    - name: Build
      run: cmake --build build -j$(nproc)
    - name: Test
      run: ctest --test-dir build --output-on-failure

  # Builds the way a distro packager would: dependencies from the system, and
  # the network unavailable to FetchContent so that a regression back to a
  # build-time download fails here rather than in somebody's build root.
  system-deps:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libyaml-cpp-dev
    - name: Configure
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DNCP_USE_SYSTEM_DEPS=ON \
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON
    - name: Build
      run: cmake --build build -j$(nproc)
    - name: Install to a staging prefix
      run: cmake --install build --prefix "$PWD/stage"
    - name: Run the installed binary from an unrelated directory
      run: cd /tmp && "$GITHUB_WORKSPACE/stage/bin/ncpatcher" version
    # dpkg is on the runner, so this is a real gate rather than a courtesy: a
    # file added to the install rules but missing from the package fails here.
    # RPM is left out only because rpmbuild is not installed; the CPack settings
    # for it are exercised by whoever builds one.
    - name: Build the packages
      run: cd build && cpack -G "DEB;TGZ"

  # Keeps the MINGW branch of CMakeLists exercised. It had been dead since it
  # was written, because it tested CMAKE_C_COMPILER in a project that never
  # enables C as a language.
  mingw:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install the cross toolchain
      run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
    - name: Configure
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/mingw-w64-x86_64.cmake"
    - name: Build
      run: cmake --build build -j$(nproc)

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            os-name: Linux
            arch-name: 64bit
          - runner: ubuntu-24.04-arm
            os-name: Linux
            arch-name: ARM64
    runs-on: ${{ matrix.runner }}
    env:
      package_name: ncpatcher_${{ github.ref_name }}_${{ matrix.os-name }}-${{ matrix.arch-name }}
    steps:
    - uses: actions/checkout@v6
    - name: Build package
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DNCP_PORTABLE_LAYOUT=ON
        cmake --build build -j$(nproc)
        cmake --install build --prefix "$PWD/$package_name"
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        path: ${{ env.package_name }}
        name: ${{ env.package_name }}
    - name: Compress package
      if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
      run: tar -cvzf $package_name.tgz $package_name
    - name: Upload to release
      if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
      uses: AButler/upload-release-assets@v3.0
      with:
        files: ${{ env.package_name }}.tgz
        repo-token: ${{ secrets.GITHUB_TOKEN }}

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            os-name: macOS
            arch-name: 64bit
          - runner: macos-15
            os-name: macOS
            arch-name: ARM64
    runs-on: ${{ matrix.runner }}
    env:
      package_name: ncpatcher_${{ github.ref_name }}_${{ matrix.os-name }}-${{ matrix.arch-name }}
    steps:
    - uses: actions/checkout@v6
    - name: Build package
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DNCP_PORTABLE_LAYOUT=ON
        cmake --build build -j$(sysctl -n hw.ncpu)
        cmake --install build --prefix "$PWD/$package_name"
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        path: ${{ env.package_name }}
        name: ${{ env.package_name }}
    - name: Compress package
      if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
      run: tar -cvzf $package_name.tgz $package_name
    - name: Upload to release
      if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
      uses: AButler/upload-release-assets@v3.0
      with:
        files: ${{ env.package_name }}.tgz
        repo-token: ${{ secrets.GITHUB_TOKEN }}

  # The generator is deliberately left to CMake's default, which is the newest
  # Visual Studio installed on the runner. Pinning it broke the moment
  # windows-latest moved from VS 2022 to VS 2026, and would break again on the
  # next bump; -A selects the target architecture with any VS generator.
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - cmake-arch: x64
            arch-name: 64bit
          - cmake-arch: Win32
            arch-name: 32bit
          - cmake-arch: ARM64
            arch-name: ARM64
    env:
      package_name: ncpatcher_${{ github.ref_name }}_Windows-${{ matrix.arch-name }}
    steps:
    - uses: actions/checkout@v6
    - name: Build package
      run: |
        cmake -B build -A ${{ matrix.cmake-arch }} -DNCP_PORTABLE_LAYOUT=ON
        cmake --build build --config Release
        cmake --install build --config Release --prefix "${{ github.workspace }}\${{ env.package_name }}"
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        path: ${{ env.package_name }}
        name: ${{ env.package_name }}
    # One installer, from the 64-bit build. The installer target stages its own
    # `cmake --install` from the same install rules as the zip, so the two
    # cannot disagree about what shipped.
    - name: Build the installer
      if: ${{ matrix.arch-name == '64bit' }}
      shell: pwsh
      run: |
        if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
            -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
          choco install nsis -y --no-progress
        }
        cmake --build build --config Release --target installer
    - name: Upload the installer
      if: ${{ matrix.arch-name == '64bit' }}
      uses: actions/upload-artifact@v7
      with:
        path: build/ncpatcher-*-setup.exe
        name: ncpatcher-setup
    - name: Upload the installer to release
      if: ${{ success() && matrix.arch-name == '64bit' && startsWith(github.ref, 'refs/tags') }}
      uses: AButler/upload-release-assets@v3.0
      with:
        files: build/ncpatcher-*-setup.exe
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Compress package
      if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
      shell: powershell
      run: tar -a -c -f "$env:package_name.zip" "$env:package_name"
    - name: Upload to release
      if: ${{ success() && startsWith(github.ref, 'refs/tags') }}
      uses: AButler/upload-release-assets@v3.0
      with:
        files: ${{ env.package_name }}.zip
        repo-token: ${{ secrets.GITHUB_TOKEN }}
